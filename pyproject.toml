[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lca-knowledge-assistant"
version = "0.1.0"
description = "A small RAG, RDF ontology, and explainable resource-matching prototype for Life Cycle Assessment (LCA)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Nadjib Taleb" }]
dependencies = [
  "streamlit>=1.36",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydantic>=2.5",
  "rdflib>=7.0",
  "PyMuPDF>=1.23",
  "requests>=2.31",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
